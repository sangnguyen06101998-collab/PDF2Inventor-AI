
name: Build PDF2Inventor AI for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v0.4-inventor-com
      - feature/v0.5-sketch-extrude
      - feature/v0.6-local-edition

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Check Python syntax and imports
        run: |
          python -m compileall -q .
          python -c "import main; import inventor_geometry; print('PDF2Inventor Local Edition V0.6 import OK')"

      - name: Run Inventor bridge unit tests
        run: python -m unittest discover -s tests -v

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name PDF2Inventor_AI
          --collect-all PySide6
          --collect-all fitz
          --hidden-import win32com
          --hidden-import win32com.client
          --hidden-import pythoncom
          --hidden-import pywintypes
          main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PDF2Inventor_AI_Windows_x64
          path: dist/PDF2Inventor_AI.exe
          if-no-files-found: error
